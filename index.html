<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ABDULLAH + AYRA — Private Access</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; }
  body {
    min-height: 100vh;
    overflow: hidden;
    background: #080808;
    color: #fff;
    font-family: "Arial Narrow", Arial, sans-serif;
  }

  .access {
    position: relative;
    min-height: 100vh;
    display: grid;
    place-items: center;
    overflow: hidden;
    isolation: isolate;
    background:
      radial-gradient(circle at 78% 18%, rgba(220,0,20,.24), transparent 27%),
      radial-gradient(circle at 12% 82%, rgba(255,255,255,.08), transparent 24%),
      #080808;
  }

  /* halftone */
  .access::before {
    content: "";
    position: absolute;
    inset: 0;
    z-index: -3;
    opacity: .2;
    background-image: radial-gradient(#fff 0.9px, transparent 1px);
    background-size: 9px 9px;
  }

  /* huge Persona-style graphic slash */
  .slash {
    position: absolute;
    z-index: -2;
    width: 150vw;
    height: 110px;
    background: #e60018;
    transform: rotate(-16deg);
    left: -25vw;
    top: 43%;
    box-shadow: 0 0 0 8px #080808, 0 0 0 14px #fff;
    opacity: .95;
  }

  .slash.two {
    height: 34px;
    top: 31%;
    transform: rotate(18deg);
    background: #fff;
    opacity: .9;
  }

  .slash.three {
    height: 18px;
    top: 69%;
    transform: rotate(-8deg);
    background: #e60018;
    opacity: .75;
  }

  .shape {
    position: absolute;
    font-family: Impact, "Arial Black", sans-serif;
    font-weight: 900;
    color: #e60018;
    opacity: .9;
    user-select: none;
  }

  .shape.s1 { top: 8%; left: 7%; font-size: clamp(42px, 8vw, 100px); transform: rotate(-12deg); }
  .shape.s2 { right: 7%; bottom: 8%; font-size: clamp(40px, 7vw, 90px); transform: rotate(12deg); }
  .shape.s3 { right: 14%; top: 13%; color: #fff; font-size: 28px; transform: rotate(18deg); }

  .card {
    position: relative;
    width: min(560px, 90vw);
    padding: clamp(28px, 5vw, 52px);
    background: #111;
    border: 5px solid #fff;
    box-shadow: 16px 16px 0 #e60018, -9px -9px 0 #000;
    transform: rotate(-1deg);
    animation: cardIn .55s cubic-bezier(.2,.9,.25,1) both;
  }

  .card::before {
    content: "";
    position: absolute;
    inset: 10px;
    border: 2px solid rgba(255,255,255,.22);
    pointer-events: none;
  }

  .card::after {
    content: "♡";
    position: absolute;
    right: 20px;
    top: 12px;
    font-size: 32px;
    color: #e60018;
    transform: rotate(12deg);
  }

  .kicker {
    display: inline-block;
    padding: 7px 13px;
    background: #e60018;
    color: #fff;
    font-family: Impact, "Arial Black", sans-serif;
    font-size: 15px;
    letter-spacing: .16em;
    transform: skewX(-10deg) rotate(-1deg);
    box-shadow: 5px 5px 0 #000;
  }

  .title-wrap {
    margin-top: 24px;
    line-height: .78;
    transform: rotate(-2deg);
  }

  .private {
    display: block;
    margin-left: 6px;
    color: #fff;
    font-family: Impact, "Arial Black", sans-serif;
    font-size: clamp(30px, 6vw, 48px);
    letter-spacing: .03em;
  }

  h1 {
    margin: 0;
    color: #e60018;
    font-family: Impact, "Arial Black", sans-serif;
    font-size: clamp(72px, 14vw, 128px);
    letter-spacing: -.045em;
    text-shadow: 7px 7px 0 #fff, 12px 12px 0 #000;
  }

  .subtitle {
    margin: 25px 0 30px;
    font-family: Impact, "Arial Black", sans-serif;
    font-size: clamp(18px, 3vw, 25px);
    letter-spacing: .18em;
    transform: skewX(-8deg);
  }

  label {
    display: block;
    margin-bottom: 9px;
    color: #fff;
    font-family: Impact, "Arial Black", sans-serif;
    font-size: 14px;
    letter-spacing: .13em;
  }

  .input-row {
    display: flex;
    background: #fff;
    border: 4px solid #000;
    box-shadow: 6px 6px 0 #e60018;
  }

  input {
    width: 100%;
    min-width: 0;
    border: 0;
    outline: 0;
    padding: 15px 16px;
    background: #fff;
    color: #111;
    font: 700 18px "Arial Narrow", Arial, sans-serif;
    letter-spacing: .12em;
  }

  input::placeholder { color: #777; }

  .eye {
    width: 55px;
    border: 0;
    border-left: 3px solid #111;
    background: #fff;
    color: #111;
    font-size: 20px;
    cursor: pointer;
  }

  .enter {
    width: 100%;
    margin-top: 22px;
    padding: 15px 18px;
    border: 4px solid #fff;
    background: #e60018;
    color: #fff;
    cursor: pointer;
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-family: Impact, "Arial Black", sans-serif;
    font-size: 24px;
    letter-spacing: .08em;
    box-shadow: 7px 7px 0 #000;
    transform: skewX(-7deg);
    transition: transform .12s ease, background .12s ease;
  }

  .enter:hover {
    background: #fff;
    color: #e60018;
    transform: translate(-3px,-3px) skewX(-7deg);
  }

  .message {
    min-height: 22px;
    margin: 15px 0 0;
    color: #fff;
    font-weight: 900;
    letter-spacing: .08em;
    text-align: center;
  }

  .footer {
    display: flex;
    justify-content: space-between;
    gap: 12px;
    margin-top: 27px;
    color: #999;
    font-size: 11px;
    font-weight: 900;
    letter-spacing: .13em;
  }

  .shake { animation: shake .32s ease; }
  .unlocked {
    animation: unlock .55s ease forwards;
  }

  @keyframes cardIn {
    from { opacity: 0; transform: translateY(30px) rotate(-5deg) scale(.96); }
    to { opacity: 1; transform: translateY(0) rotate(-1deg) scale(1); }
  }

  @keyframes shake {
    0%,100% { transform: translateX(0); }
    25% { transform: translateX(-8px); }
    50% { transform: translateX(8px); }
    75% { transform: translateX(-5px); }
  }

  @keyframes unlock {
    0% { opacity: 1; transform: scale(1); }
    45% { transform: scale(1.04) rotate(1deg); }
    100% { opacity: 0; transform: scale(1.15) rotate(-2deg); visibility: hidden; }
  }

  @media (max-width: 600px) {
    .card {
      width: 88vw;
      padding: 25px 21px;
      border-width: 4px;
      box-shadow: 10px 10px 0 #e60018, -6px -6px 0 #000;
    }
    h1 { font-size: clamp(64px, 20vw, 100px); }
    .subtitle { margin-bottom: 24px; }
    .slash { height: 70px; }
  }
</style>
</head>
<body>
  <main class="access" id="access">
    <div class="slash"></div>
    <div class="slash two"></div>
    <div class="slash three"></div>

    <div class="shape s1">✦</div>
    <div class="shape s2">★</div>
    <div class="shape s3">✦</div>

    <section class="card" id="card">
      <div class="kicker">ABDULLAH + AYRA</div>

      <div class="title-wrap">
        <span class="private">PRIVATE</span>
        <h1>ACCESS</h1>
      </div>

      <div class="subtitle">TAKE YOUR HEART</div>

      <form id="form">
        <label for="password">ENTER PASSWORD</label>

        <div class="input-row">
          <input id="password" type="password" placeholder="PASSWORD"
                 autocomplete="off" spellcheck="false" required>
          <button class="eye" id="eye" type="button" aria-label="Show password">◉</button>
        </div>

        <button class="enter" type="submit">
          <span>ENTER</span>
          <span>→</span>
        </button>

        <p class="message" id="message" aria-live="polite"></p>
      </form>

      <div class="footer">
        <span>ONLY US</span>
      </div>
    </section>
  </main>

<script>
  // Change this to the password you want.
  const PASSWORD = "ayraisthebest";

  const form = document.getElementById("form");
  const input = document.getElementById("password");
  const eye = document.getElementById("eye");
  const message = document.getElementById("message");
  const card = document.getElementById("card");

  eye.addEventListener("click", () => {
    const showing = input.type === "text";
    input.type = showing ? "password" : "text";
    eye.textContent = showing ? "◉" : "◎";
    eye.setAttribute("aria-label", showing ? "Show password" : "Hide password");
  });

  form.addEventListener("submit", (event) => {
    event.preventDefault();

    if (input.value === PASSWORD) {
      message.textContent = "ACCESS GRANTED";
      card.classList.add("unlocked");

      setTimeout(() => {
        // Replace this with your actual homepage when you integrate it.
        window.location.replace("./home.html");
      }, 550);
    } else {
      message.textContent = "ACCESS DENIED — TRY AGAIN";
      input.value = "";
      card.classList.remove("shake");
      void card.offsetWidth;
      card.classList.add("shake");
      input.focus();
    }
  });
</script>
</body>
</html>
